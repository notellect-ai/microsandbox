# Proof-only workflow for an upstream PR draft. It lives ONLY on the fork's
# notellect/pr-proof/<name>[-unfixed-*] branches (one extra commit on top of the
# PR branch); the PR branch itself never carries it.
name: PR proof

on:
  push:
    branches: ["notellect/pr-proof/**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"

jobs:
  # microsandbox embeds agentd.
  agentd:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          rustup toolchain install stable --profile minimal --target x86_64-unknown-linux-musl
          rustup default stable
      - run: cargo build --locked --release --manifest-path crates/agentd/Cargo.toml --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@v4
        with: { name: agentd, path: target/x86_64-unknown-linux-musl/release/agentd, if-no-files-found: error, compression-level: 0 }

  windows:
    needs: agentd
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
            vs_arch: amd64
            vs_host_arch: amd64
          - runner: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
            vs_arch: arm64
            vs_host_arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      MSB_EMBED_ARTIFACTS_DIR: ${{ github.workspace }}\embed
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.rust_target }}
      - uses: actions/download-artifact@v4
        with: { name: agentd, path: embed }
      - shell: pwsh
        run: New-Item -ItemType File -Force -Path embed\msb.exe, embed\libkrunfw.dll | Out-Null
      - name: Show runner elevation
        shell: cmd
        run: whoami /user /groups
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        shell: bash
        run: cargo clippy --locked -p microsandbox-utils -p microsandbox-metrics --all-targets -- -D warnings && cargo clippy --locked --no-default-features --features net,runner -p microsandbox-runtime --lib -- -D warnings && cargo clippy --locked --no-default-features --features local,net,cloud -p microsandbox --lib -- -D warnings
      - name: Clippy CLI
        # The embedded agentd is x86_64; the CLI's build checks it against the target.
        if: always() && matrix.runner == 'windows-latest'
        shell: bash
        run: cargo clippy --locked -p microsandbox-cli --bins -- -D warnings
      - name: Check out libkrunfw (for msvc-env.ps1)
        if: always()
        shell: bash
        run: git submodule update --init --depth 1 vendor/libkrunfw
      - name: Extract the check.yml step verbatim
        if: always()
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
          VS_ARCH: ${{ matrix.vs_arch }}
          VS_HOST_ARCH: ${{ matrix.vs_host_arch }}
        run: |
          python - "Test elevated object sharing" > check-step.ps1 <<'PY'
          # Print one windows-quality step's `run` script from check.yml, verbatim,
          # with only the matrix expressions filled in for this runner.
          import os, sys
          name = sys.argv[1]
          lines = open('.github/workflows/check.yml', encoding='utf-8').read().splitlines()
          start = next(i for i, l in enumerate(lines) if l.strip() == f'- name: {name}')
          run = next(i for i in range(start, len(lines)) if lines[i].strip() == 'run: |')
          indent = len(lines[run]) - len(lines[run].lstrip())
          body = []
          for l in lines[run + 1:]:
              if l.strip() and len(l) - len(l.lstrip()) <= indent:
                  break
              body.append(l)
          pad = min(len(l) - len(l.lstrip()) for l in body if l.strip())
          script = '\n'.join(l[pad:] for l in body).rstrip() + '\n'
          for key, value in {
              '$' '{{ matrix.rust_target }}': os.environ['RUST_TARGET'],
              '$' '{{ matrix.vs_arch }}': os.environ['VS_ARCH'],
              '$' '{{ matrix.vs_host_arch }}': os.environ['VS_HOST_ARCH'],
          }.items():
              script = script.replace(key, value)
          assert '$' '{{' not in script, script
          # What the Actions pwsh shell appends to every run script.
          script += 'if ((Test-Path -LiteralPath variable:\\LASTEXITCODE)) { exit $LASTEXITCODE }\n'
          sys.stdout.write(script)
          PY
          cat check-step.ps1
      - name: "Run check.yml step verbatim: Test elevated object sharing"
        if: always()
        shell: pwsh
        run: |
          pwsh -NoProfile -NonInteractive -File check-step.ps1
          exit $LASTEXITCODE
      - name: Launch and SDK tests
        if: always()
        shell: bash
        run: |
          rc=0
          cargo test --locked --no-default-features --features net,runner -p microsandbox-runtime --lib -- launch || rc=1
          cargo test --locked --no-default-features --features local,net,cloud -p microsandbox --lib -- elevated || rc=1
          exit $rc
