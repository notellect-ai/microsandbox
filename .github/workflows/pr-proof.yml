# Proof-only workflow for an upstream PR draft. It lives ONLY on the fork's
# notellect/pr-proof/<name>[-unfixed] branches (one extra commit on top of the
# PR branch); the PR branch itself never carries it.
name: PR proof

on:
  push:
    branches: ["notellect/pr-proof/**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"

jobs:
  # Needed only if a crate under test embeds agentd (microsandbox-filesystem,
  # microsandbox, microsandbox-cli). Delete this job and the download step otherwise.
  agentd:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          rustup toolchain install stable --profile minimal --target x86_64-unknown-linux-musl
          rustup default stable
      - run: cargo build --locked --release --manifest-path crates/agentd/Cargo.toml --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@v4
        with: { name: agentd, path: target/x86_64-unknown-linux-musl/release/agentd, if-no-files-found: error, compression-level: 0 }

  windows:
    needs: agentd
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
            vs_arch: amd64
          - runner: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
            vs_arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      MSB_EMBED_ARTIFACTS_DIR: ${{ github.workspace }}\embed
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/download-artifact@v4
        with: { name: agentd, path: embed }
      - shell: pwsh
        run: New-Item -ItemType File -Force -Path embed\msb.exe, embed\libkrunfw.dll | Out-Null
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        shell: bash
        run: |
          # Other files of these crates already carry Windows clippy warnings on
          # the base, so only the files this change touches must be clean.
          set -eo pipefail
          cargo clippy --locked --no-default-features --features net,ssh,keyring -p microsandbox-cli --all-targets --message-format=short 2>&1 | tee clippy.log
          cargo clippy --locked -p microsandbox-utils --all-targets --message-format=short 2>&1 | tee -a clippy.log
          cargo clippy --locked --no-default-features --features net,runner -p microsandbox-runtime --lib --profile test --message-format=short 2>&1 | tee -a clippy.log
          cargo clippy --locked --no-default-features --features local,net -p microsandbox --lib --profile test --message-format=short 2>&1 | tee -a clippy.log
          if grep -E '(bin[\\/]main|commands[\\/]common|machine_cmd|checkpoint[\\/]disk|compat[\\/]launch|client[\\/]launch|resize_read_tests|runner[\\/]vm|custom_backends|utils[\\/]lib[\\/]lib|mount_path|sandbox[\\/]create|launch_contract|runtime[\\/]spawn|sandbox[\\/]types)\.rs:[0-9]+:[0-9]+: (warning|error)' clippy.log; then exit 1; fi
      - name: Check out libkrunfw (for msvc-env.ps1)
        if: always()
        shell: bash
        run: git submodule update --init --depth 1 vendor/libkrunfw
      - name: Extract the check.yml step verbatim
        if: always()
        shell: bash
        run: |
          python - "Test mount host path encoding" "${{ matrix.rust_target }}" "${{ matrix.vs_arch }}" > check-step.ps1 <<'PY'
          # Print one windows-quality step's `run` script from check.yml, verbatim,
          # with only the matrix expressions filled in for this runner.
          import sys
          name = sys.argv[1]
          lines = open('.github/workflows/check.yml', encoding='utf-8').read().splitlines()
          start = next(i for i, l in enumerate(lines) if l.strip() == f'- name: {name}')
          run = next(i for i in range(start, len(lines)) if lines[i].strip() == 'run: |')
          indent = len(lines[run]) - len(lines[run].lstrip())
          body = []
          for l in lines[run + 1:]:
              if l.strip() and len(l) - len(l.lstrip()) <= indent:
                  break
              body.append(l)
          pad = min(len(l) - len(l.lstrip()) for l in body if l.strip())
          script = '\n'.join(l[pad:] for l in body).rstrip() + '\n'
          for key, value in {
              '$' '{{ matrix.rust_target }}': sys.argv[2],
              '$' '{{ matrix.vs_arch }}': sys.argv[3],
              '$' '{{ matrix.vs_host_arch }}': sys.argv[3],
          }.items():
              script = script.replace(key, value)
          assert '$' '{{' not in script, script
          # What the Actions pwsh shell appends to every run script.
          script += 'if ((Test-Path -LiteralPath variable:\\LASTEXITCODE)) { exit $LASTEXITCODE }\n'
          sys.stdout.write(script)
          PY
          cat check-step.ps1
      - name: "Run check.yml step verbatim: Test mount host path encoding"
        if: always()
        shell: pwsh
        env:
          MSB_AGENTD_PATH: ${{ github.workspace }}\embed\agentd
        run: |
          pwsh -NoProfile -NonInteractive -File check-step.ps1
          exit $LASTEXITCODE
      - name: Tests
        if: always()
        shell: bash
        run: |
          rc=0
          cargo test --locked -p microsandbox-utils --lib -- mount_host_path || rc=1
          cargo test --locked --no-default-features --features net,runner -p microsandbox-runtime --lib -- host_path || rc=1
          cargo test --locked --no-default-features --features local,net -p microsandbox --lib -- wire_separators mount_host_path || rc=1
          exit $rc

  ubuntu:
    needs: agentd
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MSB_EMBED_ARTIFACTS_DIR: ${{ github.workspace }}/embed
    steps:
      - uses: actions/checkout@v4
      - run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - run: |
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get update && sudo apt-get install -y musl-tools libcap-ng-dev python3-dev
      - uses: actions/download-artifact@v4
        with: { name: agentd, path: embed }
      - run: touch embed/msb embed/libkrunfw.so.5.6.1
      - name: Clippy
        run: cargo clippy --locked -p microsandbox-utils -p microsandbox-runtime -p microsandbox -p microsandbox-cli --all-targets -- -D warnings
      - name: Tests
        if: always()
        run: |
          rc=0
          cargo test --locked -p microsandbox-utils --lib -- mount_host_path || rc=1
          cargo test --locked -p microsandbox-runtime --lib -- host_path || rc=1
          cargo test --locked -p microsandbox --lib -- wire_separators mount_host_path || rc=1
          cargo test --locked -p microsandbox-cli --lib -- apply_volume_accepts_comma || rc=1
          exit $rc

  node:
    needs: agentd
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MSB_EMBED_ARTIFACTS_DIR: ${{ github.workspace }}/embed
    steps:
      - uses: actions/checkout@v4
      - run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - run: sudo apt-get update && sudo apt-get install -y libcap-ng-dev
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { name: agentd, path: embed }
      - run: touch embed/msb embed/libkrunfw.so.5.6.1
      - name: Node unit test (builders)
        working-directory: sdk/node-ts
        run: |
          node scripts/prune-platform-optional-deps.mjs
          npm ci --ignore-scripts
          npm run build:ci
          npx vitest run tests/unit/builders.test.ts
