# Proof-only workflow for an upstream PR draft. It lives ONLY on the fork's
# notellect/pr-proof/<name>[-mutants] branches (one extra commit on top of the
# PR branch); the PR branch itself never carries it.
name: PR proof

on:
  push:
    branches: ["notellect/pr-proof/**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"

jobs:
  windows:
    name: windows (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        shell: bash
        run: cargo clippy --locked -p microsandbox-vsock --all-targets -- -D warnings
      - name: Tests
        shell: bash
        run: cargo test --locked -p microsandbox-vsock
