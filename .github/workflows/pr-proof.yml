# Proof-only workflow for an upstream PR draft. It lives ONLY on the fork's
# notellect/pr-proof/<name>[-unfixed] branches (one extra commit on top of the
# PR branch); the PR branch itself never carries it.
name: PR proof

on:
  push:
    branches: ["notellect/pr-proof/**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"

jobs:
  agentd:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          rustup toolchain install stable --profile minimal --target x86_64-unknown-linux-musl
          rustup default stable
      - run: cargo build --locked --release --manifest-path crates/agentd/Cargo.toml --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@v4
        with: { name: agentd, path: target/x86_64-unknown-linux-musl/release/agentd, if-no-files-found: error, compression-level: 0 }

  windows:
    needs: agentd
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      MSB_EMBED_ARTIFACTS_DIR: ${{ github.workspace }}\embed
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/download-artifact@v4
        with: { name: agentd, path: embed }
      - shell: pwsh
        run: New-Item -ItemType File -Force -Path embed\msb.exe, embed\libkrunfw.dll | Out-Null
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (library)
        shell: bash
        run: cargo clippy --locked --no-default-features --features local,net,cloud -p microsandbox --lib -- -D warnings
      - name: Clippy (library unit tests)
        shell: bash
        run: |
          # The crate's other unit tests already carry clippy warnings on the base
          # (files this change does not touch), so only the changed file must be clean.
          set -o pipefail
          cargo clippy --locked --no-default-features --features local,net -p microsandbox --lib --profile test --message-format=short 2>&1 | tee clippy.log
          if grep -E '(runtime[\\/]spawn\.rs):[0-9]+:[0-9]+: (warning|error)' clippy.log; then exit 1; fi
      - name: Tests
        if: always()
        shell: bash
        run: cargo test --locked --no-default-features --features local,net -p microsandbox --lib runtime::spawn::tests::windows_ -- --nocapture
