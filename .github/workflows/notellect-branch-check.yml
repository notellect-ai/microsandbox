# Builds and tests msb for Windows on this review branch without publishing
# anything. Drop this commit before the branch goes into a release.
name: Notellect branch check (Windows)

on:
  push:
    branches: ["notellect/v0.7.16-pipe-blocking-read"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  RUST_TOOLCHAIN: "1.95.0"
  RUSTFLAGS: -C target-feature=+crt-static

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustup target add x86_64-pc-windows-msvc

      - name: Checkout libkrunfw MSVC helpers
        run: git submodule update --init --depth 1 vendor/libkrunfw

      - name: Test the vsock crate and build msb
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          . "$env:GITHUB_WORKSPACE\vendor\libkrunfw\scripts\msvc-env.ps1"
          Set-MsvcEnvironment -Architecture amd64 -HostArchitecture amd64
          cargo test --locked -p microsandbox-vsock --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --release -p microsandbox-cli --bin msb --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\x86_64-pc-windows-msvc\release\msb.exe dist\msb-windows-x86_64.exe -Force
          dist\msb-windows-x86_64.exe --version

      - uses: actions/upload-artifact@v4
        with:
          name: msb-windows-x86_64
          path: dist/*
          compression-level: 0
